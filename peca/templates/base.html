<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <title>{% block title %}{% endblock title %}</title>
</head>
<body>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 bg-white text-sm text-left text-gray-900">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-3 font-medium uppercase tracking-wider">GET</th>
          <th class="px-6 py-3 font-medium uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 font-medium uppercase tracking-wider">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr>
          <td class="px-6 py-4">João Silva</td>
          <td class="px-6 py-4">joao@example.com</td>
          <td class="px-6 py-4 text-green-600 font-semibold">Ativo</td>
        </tr>
        <tr>
          <td class="px-6 py-4">Maria Souza</td>
          <td class="px-6 py-4">maria@example.com</td>
          <td class="px-6 py-4 text-red-600 font-semibold">Inativo</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-center mt-10">
    <form class="w-full max-w-lg" method= "post" action="">
      <div class="flex mb-6 w-full">
        <div class="w-full">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-last-name">
            NOME
          </label>
          <input class="appearance-none block bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 
          px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500 w-full"
                 id="grid-last-name" type="text" name='name'>
        </div>
      </div>

      <div class="flex flex-wrap -mx-3 mb-6">
        <div class="w-full px-3">
          <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2" for="grid-password">
            TIPO
          </label>
          <input class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" 
          type="text" name="tipo" >
        </div>
      </div>
      
      <div class ="flex mt-10 p-1 bg-green-400 w-[200px] justify-center rounded">
        <button class="w-full h-full" name="enviar" type="submit">Send</button>
      </div>
    </form>
  
  </div>

</body>
</html>

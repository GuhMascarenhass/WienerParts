<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <link rel= "stylesheet" href= {{url_for("static", filename = "css/main.css" )}}>
    <title> {% block title %}{% endblock title %} </title>
   

</head>
<body>
<div class="flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">To-Do List</h1>
        <div class="space-y-4">
            <label class="flex items-center space-x-3">
                <input type="checkbox" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span class="text-gray-800">Learn Tailwind CSS</span>
            </label>

            <label class="flex items-center space-x-3">
                <input type="checkbox" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span class="text-gray-800">Build a To-Do List</span>
            </label>

            <label class="flex items-center space-x-3">
                <input type="checkbox" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span class="text-gray-800">Deploy Project</span>
            </label>

            <label class="flex items-center space-x-3">
                <input type="checkbox" class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span class="text-gray-800">Share with friends</span>
            </label>
        </div>
    </div>
</div>

</body>
</html>
